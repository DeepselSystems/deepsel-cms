name: Deepsel CMS - E2E Tests

on:
  workflow_call:
  pull_request:
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'client/**'
      - 'themes/**'
      - 'packages/cms-utils/**'
      - 'packages/cms-react/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'client/**'
      - 'themes/**'
      - 'packages/cms-utils/**'
      - 'packages/cms-react/**'
      - 'tests/e2e/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install backend (editable, with dev extras)
        working-directory: backend
        run: |
          python -m venv ../.venv
          ../.venv/bin/pip install --upgrade pip
          ../.venv/bin/pip install -e ".[dev]"

      - name: Install Node workspaces
        run: npm ci

      - name: Ensure SWC native binding
        run: npm install --no-save @swc/core-linux-x64-gnu@1.15.17 || true

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/cms-utils
          npm run build --workspace=packages/cms-react

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests/e2e

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results
          retention-days: 7
